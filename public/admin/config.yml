backend:
  name: git-gateway
  branch: main

# "simple": publica directo a main (sin revisión editorial previa). Coincide
# con el flujo de git simple que ya usa este template. Si en algún cliente
# puntual hiciera falta que alguien revise antes de publicar, cambiar a
# "editorial_workflow".
publish_mode: simple

media_folder: "public/properties"
public_folder: "/properties"

collections:
  - name: "propiedades"
    label: "Propiedades"
    folder: "src/content/properties"
    extension: "md"
    format: "frontmatter"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: titulo
    summary: "{{titulo}} — {{operacion}} — {{estado}} — {{moneda}} {{precio}}"
    fields:
      - { label: "Título", name: "titulo", widget: "string" }
      - label: "Operación"
        name: "operacion"
        widget: "select"
        options: ["Venta", "Alquiler"]
        default: "Venta"
      - label: "Estado"
        name: "estado"
        widget: "select"
        options: ["Disponible", "Reservada", "Vendida", "Alquilada"]
        default: "Disponible"
        hint: "Vendida/Alquilada: sigue visible con la etiqueta, pero sale de la home, del chatbot y del simulador."
      - label: "Tipo"
        name: "tipo"
        widget: "select"
        options: ["Casa", "Departamento", "PH", "Country", "Terreno", "Local", "Oficina"]
      - { label: "Zona", name: "zona", widget: "string" }
      - label: "Ubicación para el mapa (opcional)"
        name: "ubicacion"
        widget: "string"
        required: false
        hint: "Barrio y localidad (ej. \"Nordelta, Tigre, Buenos Aires\"). Mejor aproximada que la dirección exacta."
      - label: "Moneda"
        name: "moneda"
        widget: "select"
        options: ["USD", "ARS"]
        default: "USD"
      - { label: "Precio (en la moneda elegida; si es alquiler, por mes)", name: "precio", widget: "number", value_type: "int" }
      - { label: "Expensas (ARS por mes, opcional)", name: "expensas", widget: "number", value_type: "int", required: false }
      - { label: "Ambientes", name: "ambientes", widget: "number", value_type: "int", default: 0 }
      - { label: "Dormitorios", name: "dormitorios", widget: "number", value_type: "int", required: false }
      - { label: "Baños", name: "banos", widget: "number", value_type: "int", required: false }
      - { label: "Cocheras", name: "cocheras", widget: "number", value_type: "int", required: false }
      - { label: "Superficie total (m²)", name: "m2", widget: "number", value_type: "int" }
      - { label: "Superficie cubierta (m², opcional)", name: "m2Cubiertos", widget: "number", value_type: "int", required: false }
      - label: "Foto principal"
        name: "imagen"
        widget: "image"
      - { label: "Destacada en portada", name: "destacada", widget: "boolean", required: false, default: false }
      - { label: "Descripción", name: "descripcion", widget: "text", required: false }
      - label: "Galería de fotos (opcional, además de la principal)"
        name: "imagenes"
        widget: "list"
        required: false
        field: { label: "Foto", name: "imagen", widget: "image" }
      - label: "Características (una por línea)"
        name: "caracteristicas"
        widget: "list"
        required: false

  - name: "testimonios"
    label: "Testimonios (Google Maps)"
    folder: "src/content/testimonios"
    extension: "md"
    format: "frontmatter"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: nombre
    summary: "{{nombre}} — {{calificacion}} ★"
    # Sin foto de perfil (decisión tomada por protección de datos
    # personales): no agregar un campo de imagen acá.
    fields:
      - { label: "Nombre del autor (tal como aparece en Google)", name: "nombre", widget: "string" }
      - label: "Calificación"
        name: "calificacion"
        widget: "number"
        value_type: "int"
        min: 1
        max: 5
      - { label: "Texto de la reseña", name: "texto", widget: "text" }
      - label: "Link a la reseña en Google Maps"
        name: "link"
        widget: "string"
        hint: "Enlace \"Ver en Google Maps →\" a la ficha real de la reseña"

  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    extension: "mdx"
    format: "frontmatter"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} — {{fecha}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - label: "Fecha"
        name: "fecha"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
      - { label: "Resumen", name: "resumen", widget: "text" }
      - { label: "Contenido", name: "body", widget: "markdown" }
